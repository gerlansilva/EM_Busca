name: BuscaEM — Audit journal sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buscaem-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate journal registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/journals.json")
          journals = json.loads(path.read_text(encoding="utf-8"))

          assert isinstance(journals, list), "journals.json must be an array"
          assert journals, "journals.json is empty"

          ids = [j["id"] for j in journals]
          assert len(ids) == len(set(ids)), "duplicate journal ids"

          print(f"{len(journals)} registered journals")
          PY

      - name: Audit sources
        run: |
          python scripts/audit_sources.py

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            harvest/SOURCE_AUDIT.json \
            dist/data/source-audit.json

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "audit: verify journal metadata sources"
            git push
          fi
