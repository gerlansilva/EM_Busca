name: BuscaEM — Harvest OAI journals

on:
  workflow_dispatch:
    inputs:
      journal:
        description: "Journal id (example: zetetike) or all"
        required: true
        default: "all"
        type: string
      limit:
        description: "0 = full harvest; use 100 for a test"
        required: true
        default: "0"
        type: string
      reset:
        description: "Restart this journal from the first OAI page"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: buscaem-oai-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Harvest OAI-PMH
        shell: bash
        run: |
          ARGS=(--journal "${{ inputs.journal }}")
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS+=(--limit "${{ inputs.limit }}")
          fi
          if [ "${{ inputs.reset }}" = "true" ]; then
            ARGS+=(--reset)
          fi
          python scripts/harvest_oai.py "${ARGS[@]}"

      - name: Curate
        run: python scripts/curate.py

      - name: Publish
        run: python scripts/publish.py

      - name: Validate
        run: python scripts/validate.py

      - name: Commit corpus and checkpoints
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/normalized harvest/state harvest/quarantine dist/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "harvest: update OAI corpus"
            git push
          fi
